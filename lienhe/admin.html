<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Tour Du Lịch</title>
  <style>
    :root {
      --primary: #0d7a5f;
      --primary-dark: #0a5f49;
      --primary-soft: #e7faf4;
      --accent: #f59e0b;
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --warning: #f59e0b;
      --bg: #f4f8f7;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #dfe7ea;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: linear-gradient(180deg, #0d2d26, #0f594b);
      color: white;
      padding: 24px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      font-size: 1.3rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav button {
      border: none;
      background: transparent;
      color: #e8f5f2;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(255,255,255,0.12);
    }

    .content {
      padding: 28px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.3rem);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar .search-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }

    .search-wrap input,
    .search-wrap select,
    .field input,
    .field select {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      min-height: 46px;
      width: 100%;
    }

    .search-wrap input {
      max-width: 360px;
      flex: 1;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 16px 18px;
      border-bottom: 1px solid #edf2f7;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f8fafc;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tour-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tour-cell img {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .tour-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tour-meta strong {
      font-size: 0.95rem;
    }

    .tour-meta span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .small-btn {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .edit-btn {
      background: #e2e8f0;
      color: var(--text);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger-dark);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .status-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-confirmed {
      background: #ecfdf5;
      color: #166534;
    }

    .status-cancelled {
      background: #fef2f2;
      color: #b91c1c;
    }

    .booking-status {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      padding: 9px 10px;
      min-width: 150px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      padding: 28px 16px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      display: none;
      place-items: center;
      z-index: 99;
      padding: 18px;
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: min(760px, 100%);
      background: white;
      border-radius: 22px;
      box-shadow: 0 25px 65px rgba(15, 23, 42, 0.25);
      padding: 22px;
    }

    .modal-card.small {
      width: min(430px, 100%);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.5rem;
    }

    .close-btn {
      border: none;
      background: #f1f5f9;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-weight: 600;
      color: var(--text);
    }

    .field-error {
      min-height: 17px;
      color: var(--danger-dark);
      font-size: 0.8rem;
    }

    .invalid {
      border-color: var(--danger) !important;
      background: #fff7f7;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 860px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        padding-bottom: 12px;
      }

      .nav {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 640px) {
      .content {
        padding: 18px;
      }

      .topbar,
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">✈</div>
        <div>TourDuLich</div>
      </div>

      <nav class="nav">
        <button class="active" data-target="tour-panel">Quản lý tour</button>
        <button data-target="booking-panel">Đơn đặt tour</button>
      </nav>
    </aside>

    <main class="content">
      <section id="tour-panel" class="panel active">
        <div class="topbar">
          <div>
            <div class="eyebrow">Quản lý</div>
            <h2>Danh sách tour</h2>
          </div>
          <button class="btn btn-primary" id="addTourBtn">+ Thêm tour mới</button>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <input id="tourSearch" type="text" placeholder="Tìm tour theo tên hoặc điểm đến" />
            <select id="tourFilterCategory">
              <option value="all">Tất cả loại</option>
              <option value="Trong nước">Trong nước</option>
              <option value="Nước ngoài">Nước ngoài</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tour</th>
                <th>Loại</th>
                <th>Thời lượng</th>
                <th>Giá</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="tourTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="booking-panel" class="panel">
        <div class="topbar">
          <div>
            <div class="eyebrow">Đặt tour</div>
            <h2>Danh sách đơn đặt tour</h2>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Khách hàng</th>
                <th>Tour</th>
                <th>Ngày đi</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="tourModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="tourModalTitle">Thêm tour mới</h3>
        <button class="close-btn" type="button" data-close="tourModal">×</button>
      </div>

      <form id="tourForm" novalidate>
        <input type="hidden" id="tourId" />
        <div class="form-grid">
          <div class="field">
            <label for="tourName">Tên tour</label>
            <input id="tourName" type="text" />
            <div class="field-error" data-error="tourName"></div>
          </div>

          <div class="field">
            <label for="tourDestination">Điểm đến</label>
            <input id="tourDestination" type="text" />
            <div class="field-error" data-error="tourDestination"></div>
          </div>

          <div class="field">
            <label for="tourCountry">Quốc gia / Địa danh</label>
            <input id="tourCountry" type="text" />
            <div class="field-error" data-error="tourCountry"></div>
          </div>

          <div class="field">
            <label for="tourDuration">Thời lượng</label>
            <input id="tourDuration" type="text" />
            <div class="field-error" data-error="tourDuration"></div>
          </div>

          <div class="field">
            <label for="tourCategory">Loại</label>
            <select id="tourCategory">
              <option value="">-- Chọn loại --</option>
              <option value="Trong nước">Trong nước</option>
              <option value="Nước ngoài">Nước ngoài</option>
            </select>
            <div class="field-error" data-error="tourCategory"></div>
          </div>

          <div class="field">
            <label for="tourPrice">Giá (VNĐ)</label>
            <input id="tourPrice" type="number" min="0" step="1000" />
            <div class="field-error" data-error="tourPrice"></div>
          </div>

          <div class="field">
            <label for="tourOldPrice">Giá cũ (VNĐ)</label>
            <input id="tourOldPrice" type="number" min="0" step="1000" />
            <div class="field-error" data-error="tourOldPrice"></div>
          </div>

          <div class="field full">
            <label for="tourImage">Link hình ảnh</label>
            <input id="tourImage" type="url" />
            <div class="field-error" data-error="tourImage"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close="tourModal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteModal" class="modal" aria-hidden="true">
    <div class="modal-card small">
      <div class="modal-header">
        <h3>Xác nhận xóa</h3>
        <button class="close-btn" type="button" data-close="deleteModal">×</button>
      </div>
      <p>Bạn có chắc chắn muốn xóa tour này không?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close="deleteModal">Hủy</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
      </div>
    </div>
  </div>

  <script>
    const TOUR_KEY = 'tourdulich_tours';
    const BOOKING_KEY = 'tourdulich_bookings';

    const defaultTours = [
      {
        id: 'tour-malaysia',
        name: 'Tour Malaysia – Singapore',
        destination: 'Singapore',
        country: 'Malaysia & Singapore',
        price: 10000000,
        oldPrice: 12500000,
        duration: '5N4Đ',
        category: 'Nước ngoài',
        image: 'https://picsum.photos/seed/tour-malaysia/1200/800',
        badge: 'Giảm 20%',
        badgeType: 'sale'
      },
      {
        id: 'tour-japan',
        name: 'Tour Nhật Bản – Tokyo, Osaka',
        destination: 'Nhật Bản',
        country: 'Nhật Bản',
        price: 25400000,
        oldPrice: 28900000,
        duration: '6N5Đ',
        category: 'Nước ngoài',
        image: 'https://picsum.photos/seed/tour-japan/1200/800',
        badge: 'Hot',
        badgeType: 'hot'
      },
      {
        id: 'tour-phuquoc',
        name: 'Tour Phú Quốc – biển xanh',
        destination: 'Phú Quốc',
        country: 'Việt Nam',
        price: 6900000,
        oldPrice: 8900000,
        duration: '3N2Đ',
        category: 'Trong nước',
        image: 'https://picsum.photos/seed/tour-phuquoc/1200/800',
        badge: 'Mới',
        badgeType: 'new'
      }
    ];

    function getStorage(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        if (!value) {
          localStorage.setItem(key, JSON.stringify(fallback));
          return fallback;
        }
        return JSON.parse(value);
      } catch (error) {
        return fallback;
      }
    }

    function saveStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getTours() {
      return getStorage(TOUR_KEY, defaultTours);
    }

    function saveTours(tours) {
      saveStorage(TOUR_KEY, tours);
    }

    function getBookings() {
      return getStorage(BOOKING_KEY, [
        {
          id: 'booking-1',
          guestName: 'NGUYỄN XUÂN SON',
          phone: '0901234567',
          tourName: 'Tour Malaysia – Singapore',
          travelDate: '2026-10-20',
          status: 'pending'
        },
        {
          id: 'booking-2',
          guestName: 'TRẦN THỊ LAN ',
          phone: '0912345678',
          tourName: 'Tour Nhật Bản – Tokyo, Osaka',
          travelDate: '2026-11-05',
          status: 'confirmed'
        }
      ]);
    }

    function saveBookings(bookings) {
      saveStorage(BOOKING_KEY, bookings);
    }

    function formatCurrency(value) {
      return Number(value || 0).toLocaleString('vi-VN', {
        style: 'currency',
        currency: 'VND',
        maximumFractionDigits: 0
      });
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
      document.getElementById(id).setAttribute('aria-hidden', 'false');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      document.getElementById(id).setAttribute('aria-hidden', 'true');
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach((node) => {
        node.textContent = '';
      });
      document.querySelectorAll('#tourForm input, #tourForm select').forEach((field) => {
        field.classList.remove('invalid');
      });
    }

    function validateTourInput(data) {
      const errors = {};
      const name = String(data.name || '').trim();
      const destination = String(data.destination || '').trim();
      const country = String(data.country || '').trim();
      const duration = String(data.duration || '').trim();
      const category = String(data.category || '').trim();
      const price = Number(data.price || 0);
      const oldPrice = Number(data.oldPrice || 0);
      const image = String(data.image || '').trim();

      if (!name) errors.name = 'Tên tour không được để trống.';
      if (!destination) errors.destination = 'Điểm đến không được để trống.';
      if (!country) errors.country = 'Quốc gia không được để trống.';
      if (!duration) errors.duration = 'Thời lượng không được để trống.';
      if (!category) errors.category = 'Vui lòng chọn loại tour.';
      if (!price || price <= 0) errors.price = 'Giá tour phải lớn hơn 0.';
      if (!oldPrice || oldPrice <= 0) errors.oldPrice = 'Giá cũ phải lớn hơn 0.';
      if (!image) errors.image = 'Link hình ảnh không được để trống.';

      return { valid: Object.keys(errors).length === 0, errors };
    }

    function fillTourForm(tour) {
      document.getElementById('tourId').value = tour?.id || '';
      document.getElementById('tourName').value = tour?.name || '';
      document.getElementById('tourDestination').value = tour?.destination || '';
      document.getElementById('tourCountry').value = tour?.country || '';
      document.getElementById('tourDuration').value = tour?.duration || '';
      document.getElementById('tourCategory').value = tour?.category || '';
      document.getElementById('tourPrice').value = tour?.price || '';
      document.getElementById('tourOldPrice').value = tour?.oldPrice || '';
      document.getElementById('tourImage').value = tour?.image || '';
      document.getElementById('tourModalTitle').textContent = tour ? 'Sửa thông tin tour' : 'Thêm tour mới';
    }

    function renderTours() {
      const tours = getTours();
      const keyword = document.getElementById('tourSearch').value.trim().toLowerCase();
      const category = document.getElementById('tourFilterCategory').value;

      const filtered = tours.filter((tour) => {
        const text = `${tour.name} ${tour.destination} ${tour.country}`.toLowerCase();
        const matchesKeyword = !keyword || text.includes(keyword);
        const matchesCategory = category === 'all' || tour.category === category;
        return matchesKeyword && matchesCategory;
      });

      const body = document.getElementById('tourTableBody');
      if (!filtered.length) {
        body.innerHTML = '<tr><td colspan="5" class="empty">Không tìm thấy tour nào.</td></tr>';
        return;
      }

      body.innerHTML = filtered.map((tour) => `
        <tr>
          <td>
            <div class="tour-cell">
              <img src="${tour.image}" alt="${tour.name}" />
              <div class="tour-meta">
                <strong>${tour.name}</strong>
                <span>${tour.destination}</span>
              </div>
            </div>
          </td>
          <td>${tour.category}</td>
          <td>${tour.duration}</td>
          <td>${formatCurrency(tour.price)}</td>
          <td>
            <div class="action-group">
              <button class="small-btn edit-btn" data-action="edit-tour" data-id="${tour.id}">Sửa</button>
              <button class="small-btn delete-btn" data-action="delete-tour" data-id="${tour.id}">Xóa</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderBookings() {
      const bookings = getBookings();
      const body = document.getElementById('bookingTableBody');

      if (!bookings.length) {
        body.innerHTML = '<tr><td colspan="5" class="empty">Chưa có đơn đặt tour nào.</td></tr>';
        return;
      }

      body.innerHTML = bookings.map((booking) => `
        <tr>
          <td>
            <strong>${booking.guestName}</strong><br>
            <small>${booking.phone}</small>
          </td>
          <td>${booking.tourName}</td>
          <td>${booking.travelDate}</td>
          <td>
            <span class="status-badge ${booking.status === 'pending' ? 'status-pending' : booking.status === 'confirmed' ? 'status-confirmed' : 'status-cancelled'}">
              ${booking.status === 'pending' ? 'Chờ xác nhận' : booking.status === 'confirmed' ? 'Đã xác nhận' : 'Đã hủy'}
            </span>
          </td>
          <td>
            <select class="booking-status" data-id="${booking.id}">
              <option value="pending" ${booking.status === 'pending' ? 'selected' : ''}>Chờ xác nhận</option>
              <option value="confirmed" ${booking.status === 'confirmed' ? 'selected' : ''}>Đã xác nhận</option>
              <option value="cancelled" ${booking.status === 'cancelled' ? 'selected' : ''}>Đã hủy</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    function handleTourSubmit(event) {
      event.preventDefault();
      clearErrors();

      const payload = {
        id: document.getElementById('tourId').value || `tour-${Date.now()}`,
        name: document.getElementById('tourName').value,
        destination: document.getElementById('tourDestination').value,
        country: document.getElementById('tourCountry').value,
        duration: document.getElementById('tourDuration').value,
        category: document.getElementById('tourCategory').value,
        price: document.getElementById('tourPrice').value,
        oldPrice: document.getElementById('tourOldPrice').value,
        image: document.getElementById('tourImage').value,
      };

      const validation = validateTourInput(payload);
      if (!validation.valid) {
        Object.entries(validation.errors).forEach(([key, message]) => {
          const input = document.getElementById(`tour${key.charAt(0).toUpperCase()}${key.slice(1)}`);
          const errorNode = document.querySelector(`[data-error="${input ? input.id : key}"]`);
          if (input) input.classList.add('invalid');
          if (errorNode) errorNode.textContent = message;
        });
        return;
      }

      const tours = getTours();
      const existingIndex = tours.findIndex((tour) => tour.id === payload.id);
      const mapped = {
        ...payload,
        price: Number(payload.price),
        oldPrice: Number(payload.oldPrice),
        badge: 'Mới',
        badgeType: 'new'
      };

      if (existingIndex >= 0) {
        tours[existingIndex] = mapped;
      } else {
        tours.unshift(mapped);
      }

      saveTours(tours);
      clearErrors();
      document.getElementById('tourForm').reset();
      closeModal('tourModal');
      renderTours();
    }

    document.getElementById('addTourBtn').addEventListener('click', () => {
      clearErrors();
      document.getElementById('tourForm').reset();
      fillTourForm();
      openModal('tourModal');
    });

    document.querySelectorAll('[data-close]').forEach((button) => {
      button.addEventListener('click', () => {
        const id = button.dataset.close;
        closeModal(id);
      });
    });

    document.getElementById('tourForm').addEventListener('submit', handleTourSubmit);

    document.getElementById('tourTableBody').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const tours = getTours();
      const match = tours.find((tour) => tour.id === id);

      if (action === 'edit-tour' && match) {
        clearErrors();
        fillTourForm(match);
        openModal('tourModal');
      }

      if (action === 'delete-tour') {
        window.currentDeleteTourId = id;
        openModal('deleteModal');
      }
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
      const id = window.currentDeleteTourId;
      if (!id) return;
      const tours = getTours().filter((tour) => tour.id !== id);
      saveTours(tours);
      closeModal('deleteModal');
      renderTours();
    });

    document.getElementById('tourSearch').addEventListener('input', renderTours);
    document.getElementById('tourFilterCategory').addEventListener('change', renderTours);

    document.getElementById('bookingTableBody').addEventListener('change', (event) => {
      const select = event.target.closest('.booking-status');
      if (!select) return;
      const bookings = getBookings();
      const next = bookings.map((booking) => {
        if (booking.id === select.dataset.id) {
          return { ...booking, status: select.value };
        }
        return booking;
      });
      saveBookings(next);
      renderBookings();
    });

    document.querySelectorAll('.nav button').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        document.querySelectorAll('.nav button').forEach((item) => item.classList.toggle('active', item === button));
        document.querySelectorAll('.panel').forEach((panel) => panel.classList.toggle('active', panel.id === target));
      });
    });

    renderTours();
    renderBookings();
  </script>
</body>
</html>
