<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Việc Module Lọc & Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Danh Sách Tour & Đặt Tour</h1>
        
        <!-- 1. KHU VỰC LỌC & SẮP XẾP -->
        <div class="filter-bar">
            <select id="filterPrice">
                <option value="all">Tất cả mức giá</option>
                <option value="under2">Dưới 2.000.000đ</option>
                <option value="2to5">Từ 2 - 5.000.000đ</option>
                <option value="over5">Trên 5.000.000đ</option>
            </select>

            <select id="filterDays">
                <option value="all">Tất cả số ngày</option>
                <option value="short">Ngắn ngày (1 - 2 ngày)</option>
                <option value="medium">Vừa (3 - 4 ngày)</option>
                <option value="long">Dài ngày (5 ngày trở lên)</option>
            </select>

            <select id="sortPrice">
                <option value="default">Sắp xếp theo</option>
                <option value="asc">Giá: Thấp đến Cao</option>
                <option value="desc">Giá: Cao đến Thấp</option>
            </select>
        </div>

        <!-- 2. DANH SÁCH TOUR -->
        <div id="tourList" class="tour-grid">
            <!-- Render từ Javascript -->
        </div>
    </div>

    <!-- 3. MODAL FORM ĐẶT TOUR -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Đặt Tour: <span id="modalTourName" style="color: #007BFF;"></span></h2>
            <p>Giá vé: <span id="modalTourPrice" style="font-weight: bold; color: #FF7F50;"></span>/người</p>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label>Họ và Tên:</label>
                    <input type="text" id="cusName" placeholder="Nhập họ tên đầy đủ">
                    <span class="error-msg" id="errName"></span>
                </div>

                <div class="form-group">
                    <label>Số điện thoại:</label>
                    <input type="text" id="cusPhone" placeholder="VD: 0912345678">
                    <span class="error-msg" id="errPhone"></span>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="text" id="cusEmail" placeholder="VD: nguyenvan@gmail.com">
                    <span class="error-msg" id="errEmail"></span>
                </div>

                <div class="form-group">
                    <label>Ngày khởi hành:</label>
                    <input type="date" id="cusDate">
                    <span class="error-msg" id="errDate"></span>
                </div>

                <div class="form-group">
                    <label>Số người đi:</label>
                    <input type="number" id="cusQuantity" value="1" min="1">
                    <span class="error-msg" id="errQuantity"></span>
                </div>

                <div class="total-price-box">
                    Tổng tiền: <span id="totalPriceDisplay">0đ</span>
                </div>

                <button type="submit" class="btn-submit">Xác Nhận Đặt Tour</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
