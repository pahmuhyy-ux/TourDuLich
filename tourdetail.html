<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Hành Trình & Lộ Trình 3 Chặng - TourDuLich</title>
  <link rel="stylesheet" href="/src/style.css"> 
  <style>
    body { background: #f1f5f9; padding-top: 75px; font-family: 'Segoe UI', sans-serif; }
    .header-fixed { position: fixed; top: 0; left: 0; right: 0; background: #06281f; padding: 15px 0; z-index: 100; }
    .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    .stage-card { margin-bottom: 16px; border: 1px solid #cbd5e1; border-left: 5px solid #0d7a5f; padding: 16px; background: #f8fafc; border-radius: 10px; }
    .service-box { background: #f8fafc; padding: 18px; border-radius: 10px; border: 1px solid #e2e8f0; }
    .sticky-sidebar { position: sticky; top: 95px; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <header class="header-fixed">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">✈</span><span style="color:white">Tour<strong style="color:#f59e0b;">DuLich</strong></span></a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Trang chủ</a>
        <a href="trangtour.html" class="nav-link">Tất cả Tour</a>
        <a href="trangdonhang.html" class="nav-link">Đơn đặt chỗ</a>
        <a href="tranglienhe.html" class="nav-link">Liên hệ</a>
      </nav>
    </div>
  </header>

  <div class="container" id="tourDetailContent" style="margin-top: 25px; margin-bottom: 60px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);">
    <h3 style="text-align: center; color: #64748b;">⏳ Đang tải thông tin hành trình...</h3>
  </div>

  <!-- MODAL ĐẶT TOUR -->
  <div id="bookingModal" class="tour-detail-modal">
    <div class="tour-detail-panel" style="max-width: 500px; text-align:left;">
      <button class="tour-detail-close" onclick="closeModal()">×</button>
      <h3 style="margin-bottom: 6px; color: #0d7a5f;">Đặt Chỗ Trực Tuyến</h3>
      <p id="modalTourName" style="font-weight: bold; margin-bottom: 14px; color: #1e293b;"></p>
      
      <form id="detailBookingForm">
        <div style="margin-bottom: 10px;">
          <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Họ và tên (*)</label>
          <input type="text" id="cusName" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;" placeholder="Nguyễn Văn A">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 10px;">
          <div>
            <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Số điện thoại (*)</label>
            <input type="tel" id="cusPhone" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;" placeholder="0912345678">
          </div>
          <div>
            <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Email nhận vé (*)</label>
            <input type="email" id="cusEmail" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;" placeholder="abc@gmail.com">
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom: 10px;">
          <div>
            <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Ngày đi (*)</label>
            <input type="date" id="cusDate" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
          </div>
          <div>
            <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Người lớn</label>
            <input type="number" id="cusAdult" value="1" min="1" max="30" required oninput="calcTotal()" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
          </div>
          <div>
            <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Trẻ em (75%)</label>
            <input type="number" id="cusChild" value="0" min="0" max="20" oninput="calcTotal()" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
          </div>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="font-weight:600; font-size:13px; display:block; margin-bottom:4px;">Ghi chú đặc biệt</label>
          <input type="text" id="cusNote" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;" placeholder="Ăn chay, dị ứng, yêu cầu phòng...">
        </div>
        <div style="text-align: right; margin: 15px 0; padding:12px; background:#fff7ed; border:1px solid #fed7aa; border-radius:8px;">
          Tổng thanh toán: <span id="totalPrice" style="color: #ea580c; font-weight: bold; font-size: 22px;">0đ</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; border-radius:8px; padding:12px;">Xác nhận & Xuất vé E-Ticket</button>
      </form>
    </div>
  </div>

  <script>
    const formatMoney = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v || 0);
    let currentTour = null;

    function getDefaultStages(tourName) {
      return [
        { stage: 1, title: 'Đón đoàn & Khởi hành', destination: `Điểm hẹn trung tâm ➔ ${tourName}`, vehicle: 'Xe Limousine 29B-686.86', guide: 'Nguyễn Văn Hùng (0988.123.456)' },
        { stage: 2, title: 'Tham quan & Trải nghiệm chính', destination: `Khám phá danh thắng tại ${tourName}`, vehicle: 'Xe điện / Tàu du lịch VIP-02', guide: 'Trần Thị Mai (0912.654.321)' },
        { stage: 3, title: 'Mua sắm đặc sản & Trả khách', destination: `Chợ đặc sản ${tourName} ➔ Điểm xuất phát`, vehicle: 'Xe Limousine 29B-686.86', guide: 'Nguyễn Văn Hùng (0988.123.456)' }
      ];
    }

    async function initDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      let jsonTours = [];
      try {
        const res = await fetch('tours.json');
        jsonTours = await res.json();
      } catch (e) {}
      const adminTours = JSON.parse(localStorage.getItem('tourdulich_tours') || '[]');
      const allTours = [...adminTours, ...jsonTours];
      currentTour = allTours.find(t => String(t.id) === String(id)) || allTours[0];

      const contentDiv = document.getElementById('tourDetailContent');
      if (!currentTour) {
        contentDiv.innerHTML = `<h2>Không tìm thấy tour!</h2><a href="index.html" class="btn btn-primary">Quay lại trang chủ</a>`;
        return;
      }

      const stages = (Array.isArray(currentTour.stages) && currentTour.stages.length === 3) ? currentTour.stages : getDefaultStages(currentTour.name);
      const included = currentTour.included || ['Xe Limousine / Du thuyền đời mới suốt tuyến', 'Khách sạn tiêu chuẩn 4-5 sao (2 khách/phòng)', 'Các bữa ăn theo chương trình + Gala Dinner', 'Vé tham quan tất cả các điểm trong 3 chặng', 'Bảo hiểm du lịch trọn gói (50.000.000đ/vụ)'];
      const excluded = currentTour.excluded || ['Chi phí cá nhân, đồ uống tự gọi trong bữa ăn', 'Thuế VAT 8%', 'Phụ thu phòng đơn (nếu ở 1 mình)'];

      contentDiv.innerHTML = `
        <a href="trangtour.html" style="color: #0d7a5f; font-weight: 600; display: inline-block; margin-bottom: 18px;">← Quay lại danh sách tour</a>
        <div class="grid-2">
          <div>
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
              <span class="badge" style="position:static;">${currentTour.type || currentTour.category || 'Tour trọn gói'}</span>
              <span style="color:#0284c7; font-weight:bold; font-size:14px;">🐦 4.9/5 (Đánh giá xác thực trên Traveloka)</span>
            </div>
            <h1 style="margin: 0 0 15px 0; font-size: 1.9rem;">${currentTour.name}</h1>
            <div style="display: flex; gap: 20px; margin-bottom: 22px; color: #475569; flex-wrap: wrap; background: #f8fafc; padding: 14px; border-radius: 10px; border:1px solid #e2e8f0; font-size:14px;">
              <span>🏷️ <strong>Mã tour:</strong> ${currentTour.code || 'TO-' + currentTour.id}</span>
              <span>🛫 <strong>Khởi hành:</strong> ${currentTour.date || 'Hàng tuần'}</span>
              <span>⏱ <strong>Thời lượng:</strong> ${currentTour.duration || '3N2Đ'}</span>
              <span style="color:#0d7a5f;">🔥 <strong>Số chỗ còn nhận:</strong> ${currentTour.slots ?? 12} khách</span>
            </div>
            <img src="${currentTour.image || 'https://picsum.photos/seed/'+currentTour.id+'/1200/600'}" style="width: 100%; border-radius: 14px; margin-bottom: 28px; max-height: 400px; object-fit: cover;">
            
            <h3 style="font-size: 1.35rem; margin-bottom: 15px; color:#0f172a;">🗺️ Lộ trình di chuyển 3 Chặng (Đi đâu - Xe nào - HDV nào)</h3>
            <div style="margin-bottom: 30px;">
              ${stages.map(s => `
                <div class="stage-card">
                  <h4 style="color: #0d7a5f; margin: 0 0 10px 0; font-size:16px;">🚩 Chặng ${s.stage}: ${s.title || 'Hành trình'}</h4>
                  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; font-size:13.5px;">
                    <div style="background:white; padding:10px; border-radius:8px; border:1px solid #e2e8f0;"><span style="color:#64748b; font-size:11.5px; display:block;">📍 ĐI ĐẾN ĐÂU</span><strong>${s.destination}</strong></div>
                    <div style="background:white; padding:10px; border-radius:8px; border:1px solid #e2e8f0;"><span style="color:#64748b; font-size:11.5px; display:block;">🚌 PHƯƠNG TIỆN / XE</span><strong>${s.vehicle}</strong></div>
                    <div style="background:white; padding:10px; border-radius:8px; border:1px solid #e2e8f0;"><span style="color:#64748b; font-size:11.5px; display:block;">👨‍✈️ HƯỚNG DẪN VIÊN</span><strong>${s.guide}</strong></div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
              <div class="service-box">
                <h4 style="margin-bottom: 10px; color:#0f766e;">✅ Giá tour bao gồm</h4>
                <ul style="list-style: none; padding: 0; font-size:14px;">${included.map(i => `<li style="margin-bottom:8px;">• ${i}</li>`).join('')}</ul>
              </div>
              <div class="service-box">
                <h4 style="margin-bottom: 10px; color:#b91c1c;">❌ Không bao gồm</h4>
                <ul style="list-style: none; padding: 0; font-size:14px;">${excluded.map(e => `<li style="margin-bottom:8px;">• ${e}</li>`).join('')}</ul>
              </div>
            </div>
          </div>

          <div>
            <div class="sticky-sidebar">
              <span style="background:#dcfce7; color:#15803d; font-weight:bold; font-size:12px; padding:4px 10px; border-radius:99px;">⚡ Xác nhận tức thì</span>
              <div style="font-size: 1.9rem; color: #ea580c; font-weight: 800; margin: 12px 0;">
                ${formatMoney(currentTour.price)} <span style="font-size: 0.95rem; color: #64748b; font-weight: normal;">/ người lớn</span>
              </div>
              <p style="font-size:13px; color:#64748b; margin-bottom:15px;">Trẻ em (5-10 tuổi): <strong>${formatMoney(Math.round(currentTour.price * 0.75))}</strong></p>
              <hr style="border:none; border-top:1px solid #e2e8f0; margin:15px 0;">
              <p style="color: #475569; font-size: 0.9rem; line-height:1.7; margin-bottom: 20px;">
                ✔️ Có sẵn lộ trình 3 chặng, số xe & HDV<br>
                ✔️ Xuất vé điện tử (E-Ticket) kèm QR Code<br>
                ✔️ Miễn phí hoàn hủy trước 7 ngày
              </p>
              <button onclick="openBooking()" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px; border-radius: 10px;">Chọn Ngày & Đặt Chỗ</button>
            </div>
          </div>
        </div>
      `;
    }

    window.openBooking = () => {
      document.getElementById('modalTourName').textContent = currentTour.name;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('cusDate').min = today;
      document.getElementById('cusDate').value = currentTour.date && currentTour.date >= today ? currentTour.date : today;
      calcTotal();
      document.getElementById('bookingModal').classList.add('show');
    };

    window.closeModal = () => document.getElementById('bookingModal').classList.remove('show');
    window.calcTotal = () => {
      const adults = Math.max(1, parseInt(document.getElementById('cusAdult').value) || 1);
      const children = Math.max(0, parseInt(document.getElementById('cusChild').value) || 0);
      const total = (adults * currentTour.price) + (children * Math.round(currentTour.price * 0.75));
      document.getElementById('totalPrice').textContent = formatMoney(total);
      return { adults, children, total };
    };

    document.getElementById('detailBookingForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('cusName').value.trim();
      const phone = document.getElementById('cusPhone').value.trim();
      const email = document.getElementById('cusEmail').value.trim();
      const date = document.getElementById('cusDate').value;
      const note = document.getElementById('cusNote').value.trim();
      const { adults, children, total } = calcTotal();

      if (!/(84|0[3|5|7|8|9])+([0-9]{8})\b/g.test(phone)) { alert('Số điện thoại gồm 10 số không hợp lệ!'); return; }

      const stages = (Array.isArray(currentTour.stages) && currentTour.stages.length === 3) ? currentTour.stages : getDefaultStages(currentTour.name);
      const bookings = JSON.parse(localStorage.getItem('tourdulich_bookings') || '[]');
      bookings.unshift({
        id: 'BK-' + Date.now().toString().slice(-6),
        guestName: name, phone, email,
        guestCount: adults + children, adultCount: adults, childCount: children,
        note: note || 'Không có',
        tourName: currentTour.name, travelDate: date, totalPrice: total,
        status: 'pending', stages
      });
      localStorage.setItem('tourdulich_bookings', JSON.stringify(bookings));
      alert('🎉 Đặt chỗ thành công! Chuyển đến trang Đơn Đặt Chỗ để nhận Vé điện tử E-Ticket.');
      window.location.href = 'trangdonhang.html';
    });

    initDetail();
  </script>
</body>
</html>
